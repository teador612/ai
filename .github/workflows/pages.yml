name: Build predictions and deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "input/**"
      - "docs/**"
      - "generate_predictions.py"
      - "convert_excel_to_json.py"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install model libraries
        run: python -m pip install -r requirements.txt
      - name: Convert Excel to JSON
        run: python convert_excel_to_json.py
      - name: Save refreshed JSON in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/matches.json
          if ! git diff --cached --quiet; then
            git commit -m "Update JSON data from Excel"
            git push
          fi
      - name: Generate chronological model predictions
        run: python generate_predictions.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
