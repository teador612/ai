name: Build predictions and deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "input/**"
      - "docs/**"
      - "generate_predictions.py"
      - "convert_excel_to_json.py"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Decide whether model predictions need rebuilding
        id: rebuild
        shell: bash
        run: |
          rebuild=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || ! -s docs/predictions.json ]]; then
            rebuild=true
          else
            changed_files="$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA")"
            if echo "$changed_files" | grep -Eq '^(input/|generate_predictions.py$|convert_excel_to_json.py$|requirements.txt$)'; then
              rebuild=true
            fi
          fi
          echo "enabled=$rebuild" >> "$GITHUB_OUTPUT"
      - name: Install model libraries
        if: steps.rebuild.outputs.enabled == 'true'
        run: python -m pip install -r requirements.txt
      - name: Convert Excel to JSON
        if: steps.rebuild.outputs.enabled == 'true'
        run: python convert_excel_to_json.py
      - name: Generate chronological model predictions
        if: steps.rebuild.outputs.enabled == 'true'
        run: python generate_predictions.py
      - name: Save refreshed JSON files in the repository
        if: steps.rebuild.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/matches.json docs/predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh match predictions from Excel"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
