
name: Build predictions and deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - "input/**"
      - "docs/**"
      - "generate_predictions.py"
      - "convert_excel_to_json.py"
      - "requirements.txt"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Decide whether model predictions need rebuilding
        id: rebuild
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          REBUILD=false

          # Manuel çalıştırmada her zaman yeniden oluştur.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            REBUILD=true

          # Tahmin dosyası yoksa yeniden oluştur.
          elif [[ ! -s docs/predictions.json ]]; then
            REBUILD=true

          else
            BASE_SHA="$EVENT_BEFORE"

            # Önceki commit bilgisi boş veya geçersizse güvenli davran.
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi

            if [[ -z "$BASE_SHA" ]]; then
              REBUILD=true
            else
              # Yalnızca model girdilerini etkileyen değişiklikleri kontrol et.
              if ! git diff --quiet "$BASE_SHA" "$CURRENT_SHA" -- \
                input/ \
                generate_predictions.py \
                convert_excel_to_json.py \
                requirements.txt; then
                REBUILD=true
              fi
            fi
          fi

          echo "enabled=$REBUILD" >> "$GITHUB_OUTPUT"
          echo "Rebuild required: $REBUILD"

      - name: Install model libraries
        if: steps.rebuild.outputs.enabled == 'true'
        run: python -m pip install -r requirements.txt

      - name: Convert Excel to JSON
        if: steps.rebuild.outputs.enabled == 'true'
        run: python convert_excel_to_json.py

      - name: Generate chronological model predictions
        if: steps.rebuild.outputs.enabled == 'true'
        run: python generate_predictions.py

      - name: Save refreshed JSON files in the repository
        if: steps.rebuild.outputs.enabled == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add input/matches.json docs/predictions.json

          if ! git diff --cached --quiet; then
            git commit -m "Refresh match predictions from Excel"

            BRANCH="${GITHUB_REF_NAME}"

            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin "HEAD:$BRANCH"
          else
            echo "Kaydedilecek JSON değişikliği bulunamadı."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Publish GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
