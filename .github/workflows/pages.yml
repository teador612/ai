
name: Build predictions and deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - "input/**"
      - "docs/**"
      - "cache/**"
      - "generate_predictions.py"
      - "convert_excel_to_json.py"
      - "requirements.txt"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check whether predictions need rebuilding
        id: rebuild
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          REBUILD=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            REBUILD=true

          elif [[ ! -s docs/predictions.json ]]; then
            REBUILD=true

          elif [[ ! -s cache/predictions_state.json ]]; then
            REBUILD=true

          else
            BASE_SHA="$EVENT_BEFORE"

            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi

            if [[ -z "$BASE_SHA" ]]; then
              REBUILD=true
            elif ! git diff --quiet "$BASE_SHA" "$CURRENT_SHA" -- \
              input/ \
              generate_predictions.py \
              convert_excel_to_json.py \
              requirements.txt; then
              REBUILD=true
            fi
          fi

          echo "enabled=$REBUILD" >> "$GITHUB_OUTPUT"
          echo "Rebuild required: $REBUILD"

      - name: Install Python libraries
        if: steps.rebuild.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Convert Excel to JSON
        if: steps.rebuild.outputs.enabled == 'true'
        run: python convert_excel_to_json.py

      - name: Generate chronological predictions
        if: steps.rebuild.outputs.enabled == 'true'
        run: python generate_predictions.py

      - name: Save JSON and incremental state
        if: steps.rebuild.outputs.enabled == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add input/matches.json
          git add docs/predictions.json
          git add cache/predictions_state.json

          if [[ -f docs/predictions.backup.json ]]; then
            git add docs/predictions.backup.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Refresh chronological predictions"

            BRANCH="${GITHUB_REF_NAME}"

            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin "HEAD:$BRANCH"
          else
            echo "Kaydedilecek değişiklik bulunamadı."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
